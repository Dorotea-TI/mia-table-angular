@if (input) {
  <mat-form-field>
    <mat-select [formControl]="input" [placeholder]="column.extra && column.extra.placeholder ? column.extra.placeholder : ''">
      @for (option of column.extra.options; track option) {
        <mat-option [value]="option.id"> {{ option.title }} </mat-option>
      }
    </mat-select>
  </mat-form-field>
}
