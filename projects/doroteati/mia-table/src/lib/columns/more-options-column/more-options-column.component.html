@if (actions.length > 0) {
  <button mat-icon-button [matMenuTriggerFor]="actionsMenu" (click)="$event.stopPropagation()"><mat-icon>more_vert</mat-icon></button>
}
<mat-menu #actionsMenu="matMenu">
  @for (button of actions; track button) {
    <button mat-menu-item (click)="clickButton(button, $event)">
      <mat-icon>{{ button.icon }}</mat-icon> {{ button.title }}
    </button>
  }
</mat-menu>
