<div class="user-avatar-component">
  @if (getPhoto() != '') {
    <div class="avatar">
      <img mat-card-avatar [src]="getPhoto()" alt="{{ getFullname() }}" class="cover-image" onerror="this.src='/assets/img/user-avatar-empty.svg';">
    </div>
  }
  <div class="texts">
    <div class="user"> {{ getFullname() }} </div>
    @if (getSubtitle() != '') {
      <div class="body-2"> {{ getSubtitle() }} </div>
    }
  </div>
  @if (column.extra?.field_is_online && isOnline()) {
    <div class="check"><mat-icon>check</mat-icon></div>
  }
</div>
