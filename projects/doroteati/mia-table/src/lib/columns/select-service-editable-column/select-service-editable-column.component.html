@if (input) {
  <mat-form-field>
    <mat-select [formControl]="input" [placeholder]="column.extra && column.extra.placeholder ? column.extra.placeholder : ''">
      @if (column.extra.is_optional) {
        <mat-option [value]="undefined"> {{ column.extra.optional_title }} </mat-option>
      }
      @for (option of items; track option) {
        <mat-option [value]="option.id"> {{ getDisplayItem(option, column.extra.field_display) }} </mat-option>
      }
    </mat-select>
  </mat-form-field>
}
