<button mat-icon-button [matMenuTriggerFor]="actions" (click)="$event.stopPropagation()"><mat-icon>more_vert</mat-icon></button>
<mat-menu #actions="matMenu">
  @for (button of column.extra?.actions; track button) {
    <button mat-menu-item (click)="clickButton(button, $event)">
      <mat-icon>{{ button.icon }}</mat-icon> {{ button.title }}
    </button>
  }
</mat-menu>
