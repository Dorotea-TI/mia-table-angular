<div [matMenuTriggerFor]="editColumnsMenu">
  <ng-content></ng-content>
</div>

<mat-menu #editColumnsMenu="matMenu" class="mat-menu-list">
  <div class="content" (click)="$event.stopPropagation()" [ngClass]="{'is-multiple-select': true}">
    <mat-selection-list [multiple]="true" (selectionChange)="onChange($event)">
      @for (column of config.columns; track column) {
        <mat-list-option [value]="column" [selected]="column.isShow">
          @if (column.title == '' || column.title == undefined) {
            <span>{{ column.key }}</span>
          }
          @if (column.title != '' && column.title != undefined) {
            <span>{{ column.title }}</span>
          }
        </mat-list-option>
      }
    </mat-selection-list>
  </div>

</mat-menu>
